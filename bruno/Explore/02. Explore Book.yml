info:
  name: 02. Explore Book
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/explore/{{idBible}}/{{idBook}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.idBible
      operator: eq
      value: "{{idBible}}"
    - expression: res.body.book.idBook
      operator: eq
      value: "{{idBook}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
