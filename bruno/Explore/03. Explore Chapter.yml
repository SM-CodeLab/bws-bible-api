info:
  name: 03. Explore Chapter
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/explore/{{idBible}}/{{idBook}}/{{idChapter}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.idBible
      operator: eq
      value: "{{idBible}}"
    - expression: res.body.idBook
      operator: eq
      value: "{{idBook}}"
    - expression: res.body.chapter.idChapter
      operator: eq
      value: "{{idChapter}}"
    - expression: res.body.chapter.verses.length
      operator: gte
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
