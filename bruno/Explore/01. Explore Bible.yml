info:
  name: 01. Explore Bible
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/explore/{{idBible}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.bible.idBible
      operator: eq
      value: "{{idBible}}"
    - expression: res.body.bible.books.length
      operator: gte
      value: "26"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
