info:
  name: 04. Explore Verse
  type: http
  seq: 4

http:
  method: GET
  url: "{{apiUrl}}/explore/{{idBible}}/{{idBook}}/{{idChapter}}:1"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.idBible
      operator: eq
      value: "{{idBible}}"
    - expression: res.body.idBook
      operator: eq
      value: "{{idBook}}"
    - expression: res.body.idChapter
      operator: eq
      value: "{{idChapter}}"
    - expression: res.body.verse.idVerse
      operator: eq
      value: "1"
    - expression: res.body.verse.verse.length
      operator: gte
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
