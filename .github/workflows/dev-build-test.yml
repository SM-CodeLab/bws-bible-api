name: Dev Build & Bruno Tests

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore NuGet packages
      run: dotnet restore

    - name: Build API
      run: dotnet build -c Release

    - name: Run Unit Tests
      run: dotnet test ./Bws.Bible.Api.Tests/Bws.Bible.Api.Tests.csproj --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-build-output
        path: |
          ./Bws.Bible.Api/bin/Release/net8.0/
          ./Bws.Bible.Infrastructure/Storage/ # Upload the storage files as well to be available for integration tests


  run-integration-tests:
    needs: build-and-unit-test # Ce job dépend du succès de 'build-and-unit-test'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4 # Chaque job commence avec un nouveau runner, donc checkout est nécessaire

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bruno CLI
      run: npm install -g @usebruno/cli

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-build-output
        path: ./Bws.Bible.Api/bin/Release/net8.0/ # Download to the correct relative path for dotnet run

    - name: Copy Storage Files for API
      # Copie le dossier Storage depuis l'emplacement du code source (après le checkout)
      # vers le répertoire où l'API s'attendra à le trouver lors de son exécution.
      run: cp -r ./Bws.Bible.Infrastructure/Storage ./Bws.Bible.Api/bin/Release/net8.0/Storage


    - name: Start API in background
      run: |
        nohup dotnet Bws.Bible.Api.dll --urls "http://localhost:5000" > api.log 2>&1 &
      working-directory: ./Bws.Bible.Api/bin/Release/net8.0/ # Run from the output directory
      env:
        ASPNETCORE_ENVIRONMENT: Development

    - name: Wait for API healthcheck
      run: |
        echo "Waiting for API to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:5000/health/live 2>/dev/null; then
            echo "✓ API is ready!"
            exit 0
          fi
          echo "Attempt $i/30 - Waiting 2 seconds..."
          sleep 2
        done
        echo "✗ API failed to start. Logs:"
        cat api.log
        exit 1

    - name: Run Bruno Tests
      working-directory: ./bruno
      run: bru run --env Dev_FR
      # continue-on-error: true # Retiré pour que le workflow échoue en cas de test Bruno échoué

    - name: Upload API logs on failure
      if: failure()
      run: |
        echo "=== API Logs ===" 
        cat api.log 2>/dev/null || echo "No logs found"
